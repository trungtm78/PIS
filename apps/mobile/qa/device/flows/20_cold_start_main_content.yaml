# STATUS: RUN ON AN EMULATOR ONLY (AVD guide, Android 15, software graphics, debug build, 2026-11-06): 3 samples out of 3 were NOT within 2.5 s. That says nothing about a
# phone (a debug build on a software renderer is far slower than a release build on a phone): the verdict stays NOT RUN until the matrix devices run it.
# Lane shots3 (2026-11-15, same AVD, debug builds, clean stacks with the whole clip seed): 2 samples on each edition, 4 out of 4 failed the wait after 8 s. On the public edition this is not time: the home of a
#   person who holds workflow tasks now shows the block "Việc theo hạn của tôi" above the alerts, so the heading "Cần bạn quyết định" is below the first screen and this wait cannot match at any speed (the
#   flow needs another mark of the loaded home, or to scroll). On the enterprise edition the heading is on the first screen and the sample was simply not within the budget on this emulator.
# UAT 2026-11-13 (same AVD, software graphics, debug build of the merge of PR 2): 2 runs, 2 failed the wait. That was not only time: the heading below merged with the
# texts of the alerts into one node, so this whole-text wait could match at no speed (fixed in the application: a heading is a node of its own). Not re-run; no verdict for a phone.
# Lane fix11 (2026-11-15): the wait now matches the first block of the loaded home (its title), which is on the first screen for a leader and for an officer on both editions.
# Lane fb (2026-11-15, same AVD, debug build of the public edition, after UAT run 4 failed 2 of 2 on both editions): the mark is right. The home of the person of the flow has the title "Tổng quan" as a node of
#   its own on the first screen (read with uiautomator); it is simply not there within 2.5 s on this emulator: 3 samples of this flow failed, and 4 timed samples of scripts/run_cold_start_samples.sh were
#   8.8 to 9.3 s (one hierarchy dump alone costs about 3 s here). The emulator gives no verdict; the budget stays 2.5 s and the verdict stays NOT RUN until a phone of the matrix runs it.
# Supports: AC-ST-MOB-040-2 / UAT-NFR-PERFORMANCE-02, the 2.5 s budget of the main content after a cold start.
# One run of this flow is ONE sample: it fails when the loaded content of the home screen is not visible within the budget, so a pass says "this sample
# was within 2.5 s as seen by Maestro" (the polling of Maestro adds up to a few hundred ms: the verdict is made from the
# timed samples of scripts/run_cold_start_samples.sh, not from this pass alone).
# The app is killed first so that the start is cold. Needs a signed-in session (05_sign_in.yaml) and the network.
appId: vn.machvon.app
---
- stopApp
- launchApp:
    clearState: false
    stopApp: true
# The FIRST block of the loaded home, as the budget defines the mark ("the first frame of the main content of the home screen", docs/qa/perf-budget.json mobile.coldStart): the title of the
# home, "Tổng quan" for a leader and "Việc hôm nay" for an officer (R53). Neither is the tab label: the tab bar is drawn before the home has its answer, and the title is drawn with the content, once the
# answer came (on no loading and no failed screen). The heading "Cần bạn quyết định" was the mark before lane fix11: the block of the person's workflow tasks pushed it below the first screen.
- extendedWaitUntil:
    visible: 'Tổng quan|Việc hôm nay'
    timeout: 2500
