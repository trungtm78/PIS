# STATUS: RUN ON AN EMULATOR ONLY (AVD guide, Android 15, software graphics, debug build, 2026-11-06): 3 samples out of 3 were NOT within 2.5 s. That says nothing about a
# phone (a debug build on a software renderer is far slower than a release build on a phone): the verdict stays NOT RUN until the matrix devices run it.
# Supports: AC-ST-MOB-040-2 / UAT-NFR-PERFORMANCE-02, the 2.5 s budget of the main content after a cold start.
# One run of this flow is ONE sample: it fails when the loaded content of the home screen is not visible within the budget, so a pass says "this sample
# was within 2.5 s as seen by Maestro" (the polling of Maestro adds up to a few hundred ms: the verdict is made from the
# timed samples of scripts/run_cold_start_samples.sh, not from this pass alone).
# The app is killed first so that the start is cold. Needs a signed-in session (05_sign_in.yaml) and the network.
appId: vn.machvon.app
---
- stopApp
- launchApp:
    clearState: false
    stopApp: true
# The heading "Cần bạn quyết định" of the alerts of the loaded home, not the tab label: the tab bar is drawn before the dashboard has its answer,
# and the body of the home (context line, alerts, command block) is built only once it has. The figures below the alerts are not used: they can
# be below the fold when three alert cards are shown.
- extendedWaitUntil:
    visible: 'Cần bạn quyết định'
    timeout: 2500
