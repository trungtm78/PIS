# STATUS: NOT RUN on a phone of the pilot device matrix (written for the emulator of the e2e stack; the host has not run it on a phone).
# UAT 2026-11-13 (emulator "guide"): two runs stopped at the wait for 'Chọn đơn vị và vai trò': the heading of the chooser and the paragraph under it were one
# semantics node, so the whole text did not match. The application now gives the heading a node of its own (AuthHeading, lib/features/session/flow.dart); not re-run since.
# UAT 2026-11-14 (enterprise edition): two runs stopped at the wait for 'Xác thực hai yếu tố' and the application was on the home screen. The application and the server were right: the second factor is
# asked of the roles the published security policy of the tenant names (BR-IAM-11), and the enterprise clip seed (clip-ent-admin, ADM-14) published a policy that named SECURITY_ADMIN and TENANT_ADMIN only,
# which took the second factor away from the owner who signs in here. The seed now publishes the default four roles (LEADER, SECURITY_ADMIN, TENANT_ADMIN, TENANT_OWNER); not re-run on a device since.
# This flow needs a tenant whose policy asks the second factor of the role of the first person (TENANT_OWNER): the default when no policy is published, and the policy of both clip datasets.
# Sign-in against the test identity provider of the e2e stack (apps/api/test/e2e-stack), the way a tester runs it on the emulator.
# Supports: MOB-02 sign-in, MOB-03 choice of unit, MOB-04 second factor, MOB-07 home (AC-ST-MOB-040-1). It replaces 05_sign_in.yaml
# only where the provider is the test one: that one signs the first fixture person in at once (no page, no password) and grants
# the second factor when the application asks for it; a real provider shows its own page (05_sign_in.yaml).
# Needs: the APK built with MACHVON_API_BASE_URL=http://127.0.0.1:3999, MACHVON_OIDC_ISSUER=http://127.0.0.1:3998/realms/machvon,
# MACHVON_OIDC_CLIENT_ID=machvon-web; the stack started with E2E_API_PORT=3999 E2E_IDP_PORT=3998 (npm run e2e:stack -w @machvon/api);
# adb reverse tcp:3999 tcp:3999 and tcp:3998 tcp:3998; the application language set to Vietnamese:
#   adb shell cmd locale set-app-locales vn.machvon.app --locales vi-VN     (clearState would reset it: use adb shell pm clear first)
appId: vn.machvon.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Đăng nhập bằng SSO'
    timeout: 20000
- tapOn: 'Đăng nhập bằng SSO'
# The first start of the system browser asks about an account and about notifications: not part of the application.
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- runFlow:
    when:
      visible: 'No thanks'
    commands:
      - tapOn: 'No thanks'
- extendedWaitUntil:
    visible: 'Chọn đơn vị và vai trò'
    timeout: 30000
- takeScreenshot: mob03_choose_unit
# The chooser lists the units of the person: the demo tenants are Đạm Phú Mỹ (enterprise) and Cao Bằng (public); either one is a good start.
- tapOn: '(Đạm Phú Mỹ|Cao Bằng).*'
- tapOn: 'Tiếp tục'
- extendedWaitUntil:
    visible: 'Xác thực hai yếu tố'
    timeout: 30000
- takeScreenshot: mob04_second_factor
- tapOn: 'Xác thực trong trình duyệt'
- extendedWaitUntil:
    visible: '(Tổng quan|Trang chủ điều hành)'
    timeout: 30000
- takeScreenshot: mob07_home
