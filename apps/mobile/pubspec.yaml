name: machvon_mobile
description: MACHVON mobile application (iOS and Android), one Flutter code base for every tenant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  geolocator: ^14.1.2
  go_router: ^17.0.0
  image: ^4.12.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  machvon_api_client:
    path: ../../packages/mobile-api-client
  machvon_tokens:
    path: ../../packages/mobile-tokens
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  permission_handler: ^13.0.2
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  permission_handler_platform_interface: any
  plugin_platform_interface: any
  device_info_plus_platform_interface: any
  local_auth_platform_interface: any
  flutter_web_auth_2_platform_interface: any
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-public.png
    - assets/brand/logo-enterprise.png
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
