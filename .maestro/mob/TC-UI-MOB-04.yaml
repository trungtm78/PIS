# TC-UI-MOB-04: Chọn đơn vị và vai trò (MOB-04): hợp đồng màn hình
# persona: theo-vai-tro-dang-chon | oracle: Claim -> FR-MOB-04 | platform: android (emulator AVD guide, debug build)
# catches_bug: Màn hình Chọn đơn vị và vai trò (MOB-04) sập hoặc tràn, có control thiếu nhãn, hoặc cho thao tác ngoài quyền của vai
# backend_policy: the real API and database of the e2e stack (apps/api/test/e2e-stack); nothing of the system under test is mocked.
appId: vn.machvon.app
tags: [P0, S2]
---
- clearState
- launchApp:
    permissions: { all: allow }
- tapOn: 'Đăng nhập bằng SSO'
- runFlow:
    when:
      visible: 'Use without an account'
    commands:
      - tapOn: 'Use without an account'
- extendedWaitUntil:
    visible: 'Chọn đơn vị và vai trò'
    timeout: 60000
- takeScreenshot: TC-UI-MOB-04-when
- assertVisible: 'Chọn đơn vị và vai trò'   # 1. screen identity
- assertVisible: 'Cao Bằng.*'   # 2. the three units of the person
- assertVisible: 'Hà Giang.*'
- assertVisible: 'Lào Cai.*'
- assertVisible: 'Tiếp tục'   # 3. the action stays off until one is chosen
- takeScreenshot: TC-UI-MOB-04-then
