name: Supply chain (daily)

# A new advisory can be published for a dependency that was clean yesterday. This workflow audits the lockfile (npm) and the pub lockfiles every day, so that
# a finding reaches a named owner within 24 hours (docs/runbooks/supply-chain.md). It changes nothing: it opens or updates one issue, assigned to the owner.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supply-chain-daily
  cancel-in-progress: false

jobs:
  audit:
    name: Daily advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The person or team that answers for supply chain findings: set the repository variable SUPPLY_CHAIN_OWNER; the owner of the repository is the fallback.
      SUPPLY_CHAIN_OWNER: ${{ vars.SUPPLY_CHAIN_OWNER != '' && vars.SUPPLY_CHAIN_OWNER || github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install product dependencies
        run: npm ci

      # The supply chain gate also checks the SBOM of the product (dist/sbom.cdx.json); it is generated here, as in ci.yml, or the audit fails on "the SBOM is missing" every day.
      - name: Generate the SBOM
        run: npm run sbom

      # The audit judges the lockfile against the exceptions of supply-chain.json (owner, reason, last day); an exception that has run out is a finding too.
      - name: Audit npm dependencies
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          npm run supply-chain:check -- --audit --locale en 2>&1 | tee audit.log

      # The pub packages and the application of the mobile clients (packages, apps/mobile): the OSV scanner reads each pubspec.lock; a package without a lockfile has nothing locked to audit.
      - name: Audit pub dependencies
        id: pub
        continue-on-error: true
        run: |
          set -o pipefail
          locks=$(find packages apps/mobile -name pubspec.lock -not -path '*/node_modules/*' | sort)
          if [ -z "$locks" ]; then echo "no pubspec.lock: nothing locked to audit" | tee pub.log; exit 0; fi
          args=""
          for lock in $locks; do args="$args --lockfile=$lock"; done
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v1.9.2@sha256:239d47ec1a70af430c3cd57524d18e8b2d2dc2f28869384217b64f409ab6650a $args 2>&1 | tee pub.log

      - name: Raise the finding with its owner
        if: steps.audit.outcome == 'failure' || steps.pub.outcome == 'failure'
        run: |
          title="Dependency advisory found by the daily audit"
          { echo "The daily supply chain audit failed on $(date -u +%F)."; echo; echo '```'; cat audit.log pub.log 2>/dev/null | tail -n 80; echo '```'; echo; echo "Owner: @$SUPPLY_CHAIN_OWNER"; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > body.md
          # A label that does not exist makes `gh issue create` fail, so the labels are created first (an existing one is left as it is).
          gh label create supply-chain --description "Findings of the supply chain audit" --color B60205 2>/dev/null || true
          gh label create security --description "Security findings" --color D93F0B 2>/dev/null || true
          existing=$(gh issue list --state open --label supply-chain --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            # The owner may not be assignable (not a collaborator): the issue is still raised, without the assignee, and the owner is named in the body.
            gh issue create --title "$title" --label supply-chain --label security --assignee "${{ env.SUPPLY_CHAIN_OWNER }}" --body-file body.md \
              || gh issue create --title "$title" --label supply-chain --label security --body-file body.md
          fi

      - name: Fail the run when the audit failed
        if: steps.audit.outcome == 'failure' || steps.pub.outcome == 'failure'
        run: exit 1
