name: CI

# Executable form of AUTONOMOUS_EXECUTION_PROTOCOL.md: the same gates run locally through
# `node ci/src/verify-cli.mjs` before shipping. See ci/README.md for the gate-to-protocol mapping.

on:
  push:
    branches: [main]
  # labeled/unlabeled re-evaluate the review-labels job when a human reviewer applies an approval label.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Protocol gates
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Design/MACHVON_Design/work/tools/package-lock.json

      # embedded-postgres ships its server binary as a per-platform npm package (no download at run time);
      # its postinstall only restores symlinks and is approved in package.json "allowScripts", so the
      # install stays non-interactive. The sql-verify stage below runs the schema on that server.
      - name: Install design tools dependencies (includes the embedded PostgreSQL)
        working-directory: Design/MACHVON_Design/work/tools
        run: npm ci

      # Product workspaces (apps/*, packages/*): the product-tests gate below runs their tests, lint and
      # the architecture check; typecheck and the script tests run here because that gate does not.
      - name: Install product dependencies
        run: npm ci

      # The mobile-tests gate runs the Dart tests of packages/mobile-tokens and packages/mobile-api-client; the Flutter version is pinned.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Product typecheck and tests (90% line coverage floor)
        run: |
          npm run typecheck
          npm test

      - name: Gate tests (90% line coverage floor)
        working-directory: ci
        run: npm test

      # Breaking API changes against the base of this change (contract-allow list: packages/contracts/compat-allow.json).
      # A base that cannot be found here is reported as SKIPPED, never as a pass.
      - name: Contract compatibility with the base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run contracts:compat -w @machvon/contracts -- --base-ref "$BASE_SHA"

      - name: Protocol gates on this change set (includes sql-verify on a real PostgreSQL)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node ci/src/verify-cli.mjs --base "$BASE_SHA" --locale en

      # Supply chain gate (docs/runbooks/supply-chain.md): pinned sources, a lockfile that matches every manifest, the
      # CycloneDX SBOM of the lockfile, and the production dependency audit (reported as SKIPPED when the registry is
      # unreachable, never as a pass).
      - name: SBOM (CycloneDX)
        run: npm run sbom

      - name: Supply chain rules and dependency audit (product workspaces)
        run: npm run supply-chain:check -- --audit --locale en

      - name: Publish the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: dist/sbom.cdx.json
          if-no-files-found: error

      - name: Dependency audit (design tools)
        working-directory: Design/MACHVON_Design/work/tools
        run: npm audit --audit-level=high

  # The two products of one code line (plan ENT-0): every part that reads the edition switch is built and tested as `public` and as `enterprise`.
  # The public build must carry nothing of the enterprise edition (scripts/edition-check.mjs also scans the built web bundle); the enterprise build must
  # carry it, so that the scan cannot pass blind. MACHVON_EDITION is the API and phone switch, VITE_EDITION the web one.
  edition-matrix:
    name: Edition ${{ matrix.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [public, enterprise]
    env:
      MACHVON_EDITION: ${{ matrix.edition }}
      VITE_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install product dependencies
        run: npm ci

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Edition check (sources, overlays, module registry)
        run: npm run edition:check

      - name: Edition mechanism of the kernel and the enterprise package
        run: |
          npm test -w @machvon/kernel -- --coverage=false --testPathPatterns "src/edition.test.ts"
          npm test -w @machvon/edition-enterprise -- --coverage=false

      - name: API, the registry mounts what the edition lists
        working-directory: apps/api
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --coverage=false --forceExit --testPathPatterns "test/editions|src/config/config.test"

      - name: Web, the shell and the routes of the edition
        working-directory: apps/web
        run: npx vitest run src/editions src/main.test.tsx src/i18n src/routes/registry.test.tsx src/navigation

      - name: Web build of the edition
        working-directory: apps/web
        run: npx vite build --outDir "$RUNNER_TEMP/web-${{ matrix.edition }}"

      - name: The public build carries nothing of the enterprise edition
        if: matrix.edition == 'public'
        run: node scripts/edition-check.mjs --public-dist "$RUNNER_TEMP/web-public"

      - name: The enterprise build carries the enterprise edition
        if: matrix.edition == 'enterprise'
        run: node scripts/edition-check.mjs --enterprise-dist "$RUNNER_TEMP/web-enterprise"

      - name: Phone, the edition switch, the title and the terminology overlay
        working-directory: apps/mobile
        run: flutter test --dart-define=MACHVON_EDITION=${{ matrix.edition }} --dart-define=MACHVON_API_BASE_URL=https://api.test/v1 test/core/edition_test.dart test/editions test/app

  # Merge gate for money, migration, authorization and similar changes: stays red until a human
  # reviewer (not the PR author, not a bot) applies review:approved:<item> after the latest push for every item the changed paths require (ci/review-rules.json).
  # Pull requests only; the local pre-push run reports this stage as skipped.
  review-labels:
    name: Human review labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues/pull-requests read: the gate checks who applied each approval label (never the PR author or a bot).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require approval labels for the reviewed items
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/src/review-labels-cli.mjs --locale en

  # The linux/arm64 leg (INFRA-1, ARM cross-platform): the product builds and its unit tests pass on a native ARM runner, so the images of the offline bundle
  # (infra/onprem, images.yml) are not x86-only by accident. native-deps:check lists the native npm packages and flags any without an arm64 build.
  arm64:
    name: ARM64 build and unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install product dependencies
        run: npm ci

      - name: Native dependencies have an arm64 build
        run: npm run native-deps:check -- --list --locale en

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Web build
        working-directory: apps/web
        run: npx vite build --outDir "$RUNNER_TEMP/web-arm64"
