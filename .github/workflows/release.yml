name: Release

# Shipping is a tagged commit that passes the same gates as CI. This workflow deploys nothing:
# there is no product runtime yet (milestone M1 is the design phase). It re-runs the gates on the
# tagged commit and publishes release notes generated from the conventional commits (scripts/release.mjs).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gates:
    name: Gates on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Design/MACHVON_Design/work/tools/package-lock.json

      - name: Install design tools dependencies (includes the embedded PostgreSQL)
        working-directory: Design/MACHVON_Design/work/tools
        run: npm ci

      # The product-tests gate runs the root workspaces (Jest, lint, dependency-cruiser).
      - name: Install product dependencies
        run: npm ci

      - name: Gate tests
        working-directory: ci
        run: npm test

      - name: Protocol gates since the previous tag
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git hash-object -t tree /dev/null)
          node ci/src/verify-cli.mjs --base "$PREVIOUS" --locale en

  publish:
    name: Publish release notes
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The notes are the changelog of scripts/release.mjs: the conventional commits since the previous tag, grouped by
      # module (ST-KERNEL-033). The signed manifest with the image digests and the SBOM (release.mjs cut) is attached
      # by the job that builds the images, which does not exist yet; docs/runbooks/release-checklist.md section 7.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git hash-object -t tree /dev/null)
          node scripts/release.mjs notes --locale en --from "$PREVIOUS" --to "$GITHUB_REF_NAME" --version "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag --title "$GITHUB_REF_NAME"
