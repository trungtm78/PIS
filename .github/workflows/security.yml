name: Security

# Static analysis, secret scanning, dependency review and a filesystem scan (docs/runbooks/infra/security-scanning.md). The daily advisory audit is supply-chain-daily.yml,
# the container image scans are images.yml, the dynamic scan is dast.yml. Nothing here needs a secret of the product; findings land in the Security tab and fail the run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SAST. The TypeScript of the API, the web application and the packages, and the workflows themselves. security-extended adds the lower-precision security queries.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # Secret scanning of the whole history, not only the last commit: a secret removed later is still a leaked secret. Rules and allowances: .gitleaks.toml.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  # A pull request may not bring in a dependency with a high advisory or a licence the product cannot ship.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, AGPL-3.0-only

  # Vulnerabilities, secrets and misconfiguration in the repository files (Dockerfiles, compose, workflows) with the policy of infra/scan/trivy.yaml.
  filesystem:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Scan the repository
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            fs --config infra/scan/trivy.yaml --scanners vuln,secret,misconfig --skip-dirs node_modules .
