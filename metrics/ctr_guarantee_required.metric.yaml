# A metric of the contract portfolio as code (CA-2, ST-BI-001). The meaning of the number is written once, in `packages/kernel/src/ctr-analytics.ts` (indicator GUARANTEE_EXPOSURE); this file only says which
# fields of the dataset DS-CTR it is made of. The dataset is read from the certified contract fact of a frozen snapshot.
# Changing what the number means (grain, unit, kind, expression, numerator, denominator) under this code needs a later effective_from, or a new code.
# Guarantee the contracts require: the first term of the exposure (required less valid). A stock: it adds up over the groups of one snapshot, never over periods.
code: ctr_guarantee_required
grain: contract
aggregation_type: semi_additive
expression:
  op: sum
  args:
    - { op: field, name: GUARANTEE_REQUIRED }
unit: VND
null_policy: NULL_NOT_ZERO
dimensions: [unit, project, fund_source, investor, contractor, contract_status, contract_type]
effective_from: "2026-11-08"
