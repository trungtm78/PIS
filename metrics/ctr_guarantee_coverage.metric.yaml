# A metric of the contract portfolio as code (CA-1, ST-BI-001). The meaning of the number is written once, in `packages/kernel/src/ctr-analytics.ts` (indicator GUARANTEE_COVERAGE); this file only says which
# fields of the dataset DS-CTR it is made of. The dataset is read from the certified contract fact of a frozen snapshot; until that source exists (part 2 of CA-1) a query over it answers DATASET_SOURCE_UNAVAILABLE.
# Changing what the number means (grain, unit, kind, expression, numerator, denominator) under this code needs a later effective_from, or a new code.
# Guarantee in force over guarantee required: below 100 the Investor is exposed.
code: ctr_guarantee_coverage
grain: contract
aggregation_type: ratio
numerator:
  op: sum
  args:
    - { op: field, name: GUARANTEE_VALID }
denominator:
  op: sum
  args:
    - { op: field, name: GUARANTEE_REQUIRED }
unit: percent
null_policy: NULL_NOT_ZERO
dimensions: [unit, project, fund_source, investor, contractor, contract_status, contract_type]
effective_from: "2026-11-08"
