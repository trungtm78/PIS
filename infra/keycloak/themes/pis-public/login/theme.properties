# The sign-in pages of the PUBLIC edition ("Hệ thống quản lý đầu tư công"): every page of the login flow (password, one-time code, enrolment,
# errors, password change, expired page, sign-out) is drawn by template.ftl of this theme; the pages themselves are those of keycloak.v2 (Keycloak 26.5).
# The realm selects it with loginTheme=pis-public (infra/keycloak/onprem/presentation.public.json). Nothing is loaded from another origin.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is the sheet of the parent (resolved through the theme hierarchy); the two after it are this theme.
styles=css/styles.css css/fonts.css css/pis.css

# One appearance in both colour schemes: the sheet of this theme is written for a light card (contrast checked for it).
darkMode=false

locales=vi,en
