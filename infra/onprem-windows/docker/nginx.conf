# Main configuration of nginx for Windows in the web image. The servers, the routes, the TLS standard and the security headers are the ones of the product
# (infra/onprem/nginx), rendered for Windows into default.conf and snippets/ by scripts/onprem-windows-pack.mjs. Paths are relative to C:\nginx.
worker_processes 1;
error_log stderr warn;
pid temp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    # No token and no query string of the sign-in is written: the request line is logged without its query.
    log_format edge '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log logs/access.log edge;
    sendfile on;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include default.conf;
}
