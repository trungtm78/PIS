# clamd of the clamav image: reached by the api and the workers on the compose network only (no port is published).
LogTime yes
LogFile C:\clamav\temp\clamd.log
LogFileMaxSize 5M
LogRotate yes
DatabaseDirectory C:\clamav\database
TemporaryDirectory C:\clamav\temp
TCPSocket 3310
TCPAddr 0.0.0.0
MaxConnectionQueueLength 30
StreamMaxLength 26M
MaxFileSize 26M
MaxScanSize 100M
MaxThreads 8
ReadTimeout 120
SelfCheck 600
Foreground yes
