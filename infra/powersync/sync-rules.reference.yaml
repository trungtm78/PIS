      - |
          SELECT g.id, g.tenant_id, g.report_revision_id, g.measurement_basis, g.construction_value_vnd, g.acceptance_value_vnd, g.treasury_submitted_value_vnd, g.preparing_dossier_value_vnd
          FROM progress_snapshot g
          JOIN report_revision r ON r.tenant_id = g.tenant_id AND r.id = g.report_revision_id
          JOIN project p ON p.tenant_id = r.tenant_id AND p.id = r.project_id
          JOIN reporting_period rp ON rp.tenant_id = r.tenant_id AND rp.id = r.period_id
          WHERE p.tenant_id = bucket.tenant_id
            AND ((bucket.scope_kind = 'project' AND p.id = bucket.scope_ref_id)
              OR (bucket.scope_kind = 'unit_subtree' AND p.owner_unit_id IN (
                SELECT u.id FROM organization_unit u JOIN organization_unit r ON r.tenant_id = u.tenant_id
                WHERE r.id = bucket.scope_ref_id AND u.tenant_id = bucket.tenant_id AND starts_with(u.path, r.path))))
            AND rp.status IN ('OPEN', 'SOFT_CLOSED') AND r.deleted_at IS NULL
            AND ((r.status = 'DRAFT' AND r.created_by = bucket.membership_id)
