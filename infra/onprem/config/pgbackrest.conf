# pgBackRest configuration of the database and of the backup runs (infra/backup/backup-policy.json is the policy this file implements).
# No secret and no host value is written here: the repository endpoint, bucket and region, the encryption pass phrase and the access keys
# arrive as PGBACKREST_REPO1_* environment variables (compose reads them from secret files through secret-env).
[global]
repo1-type=s3
repo1-s3-uri-style=path
repo1-path=/machvon
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=35
repo1-retention-archive-type=full
repo1-retention-archive=35
repo1-bundle=y
repo1-block=y
start-fast=y
archive-async=y
archive-push-queue-max=4GiB
spool-path=/var/spool/pgbackrest
compress-type=zst
compress-level=3
process-max=4
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
delta=y

[machvon]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=machvon_owner
